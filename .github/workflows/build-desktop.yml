name: Build CrossPet Plus
on:
  workflow_dispatch:
  push:
    tags: ['plus-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: build:win
          - os: macos-latest
            build: build:mac
          - os: ubuntu-latest
            build: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm run setup
      - run: npm run ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: CrossPet-Plus-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
