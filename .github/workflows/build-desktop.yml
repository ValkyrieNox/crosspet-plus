name: Build native CrossPet Plus
on:
  workflow_dispatch:
  push:
    tags: ['v*-plus.*']
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm run setup
      - run: npm run test:plus
      - run: npm run test:mac:bridge
      - run: npm run build:mac -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: CrossPet-Plus-macOS-${{ matrix.arch }}
          path: build/CrossPet-Plus-*-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm run setup
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: CrossPet-Plus-Windows-native
          path: build/CrossPet-Windows.zip
          if-no-files-found: error
