name: Build native CrossPet Plus
on:
  workflow_dispatch:
  push:
    tags: ['v*-plus.*']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm run setup
      - run: python3 scripts/audit-crosspet-original.py
      - run: node tests/page_switch_test.cjs
      - run: npm run test:plus
      - run: npm run test:mac:bridge
      - run: npm run build:mac -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: CrossPet-Plus-macOS-${{ matrix.arch }}
          path: build/CrossPet-Plus-*-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm run setup
      - run: python scripts/audit-crosspet-original.py
      - run: node tests/page_switch_test.cjs
      - run: dotnet run --project tests/windows/LogicTests -c Release
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: CrossPet-Plus-Windows-native
          path: build/CrossPet-Windows.zip
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: CrossPet-Plus-*
          path: release-assets
          merge-multiple: true
      - name: Publish matching native packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh release-assets
